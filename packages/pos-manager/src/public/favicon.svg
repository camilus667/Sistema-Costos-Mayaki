<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="pos-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>
    <linearGradient id="pos-accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
    <linearGradient id="barcode-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="128" fill="url(#pos-bg)"/>
  <rect x="16" y="16" width="480" height="480" rx="112" fill="none" stroke="url(#pos-accent)" stroke-width="8" stroke-opacity="0.5"/>

  <!-- Matrix Grid 3x3 -->
  <g filter="url(#glow)">
    <!-- Matrix Outer Container -->
    <rect x="96" y="96" width="320" height="320" rx="36" fill="none" stroke="url(#pos-accent)" stroke-width="14"/>

    <!-- Grid Cells -->
    <rect x="128" y="128" width="72" height="72" rx="16" fill="#06b6d4" fill-opacity="0.9"/>
    <rect x="220" y="128" width="72" height="72" rx="16" fill="#6366f1" fill-opacity="0.9"/>
    <rect x="312" y="128" width="72" height="72" rx="16" fill="#06b6d4" fill-opacity="0.9"/>

    <rect x="128" y="220" width="72" height="72" rx="16" fill="#6366f1" fill-opacity="0.9"/>
    <rect x="220" y="220" width="72" height="72" rx="16" fill="#10b981" fill-opacity="1"/>
    <rect x="312" y="220" width="72" height="72" rx="16" fill="#6366f1" fill-opacity="0.9"/>

    <rect x="128" y="312" width="72" height="72" rx="16" fill="#06b6d4" fill-opacity="0.9"/>
    <rect x="220" y="312" width="72" height="72" rx="16" fill="#6366f1" fill-opacity="0.9"/>
    <rect x="312" y="312" width="72" height="72" rx="16" fill="#06b6d4" fill-opacity="0.9"/>
  </g>

  <!-- Barcode Tag Badge Overlay -->
  <g transform="translate(240, 240)">
    <rect x="30" y="30" width="160" height="160" rx="32" fill="#0f172a" stroke="url(#barcode-glow)" stroke-width="10"/>
    <!-- Barcode lines -->
    <rect x="60" y="65" width="12" height="90" rx="4" fill="#10b981"/>
    <rect x="82" y="65" width="6" height="90" rx="3" fill="#34d399"/>
    <rect x="98" y="65" width="18" height="90" rx="4" fill="#10b981"/>
    <rect x="126" y="65" width="8" height="90" rx="4" fill="#34d399"/>
    <rect x="144" y="65" width="14" height="90" rx="4" fill="#10b981"/>
  </g>
</svg>
