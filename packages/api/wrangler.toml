name = "sistema-uniformes-api"
main = "src/index.ts"
compatibility_date = "2024-01-17"
compatibility_flags = ["nodejs_compat"]

[[d1_databases]]
binding = "DB"
database_name = "sistema-uniformes"
database_id = "local-d1-id"

[vars]
ENVIRONMENT = "development"
JWT_SECRET = "dev-secret-key-1234567890"

[env.production]
[env.production.vars]
ENVIRONMENT = "production"
