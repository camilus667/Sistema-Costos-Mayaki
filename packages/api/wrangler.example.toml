# Cloudflare Wrangler Configuration
# Copy this file to wrangler.toml and update with your Cloudflare account details

name = "sistema-uniformes-api"
main = "src/index.ts"
compatibility_date = "2024-01-17"
node_compat = true

# Workers KV Namespace
# [[kv_namespaces]]
# binding = "SESSSIONS"
# id = "your-kv-namespace-id"

# Cloudflare D1 Database
[[d1_databases]]
binding = "DB"
database_name = "sistema-uniformes"
database_id = "your-d1-database-id"

# Routing
rules = [
  { type = "ESModule", globs = ["**/*.js"], fallthrough = true }
]

# Production
[env.production]
[env.production.vars]
NODE_VERSION = "20.0.0"
ENVIRONMENT = "production"

# Development
[env.dev]
[env.dev.vars]
NODE_VERSION = "20.0.0"
ENVIRONMENT = "development"
