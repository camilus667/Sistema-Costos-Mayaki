<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bank-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="cyan-blue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="50%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <linearGradient id="gold-accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <filter id="bank-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Container Background -->
  <rect width="512" height="512" rx="120" fill="url(#bank-bg)"/>
  <rect x="16" y="16" width="480" height="480" rx="104" fill="none" stroke="url(#cyan-blue)" stroke-width="10" stroke-opacity="0.7"/>

  <!-- Bank Icon Group -->
  <g filter="url(#bank-glow)">
    <!-- Roof / Pediment -->
    <polygon points="256,100 80,200 432,200" fill="url(#cyan-blue)"/>
    <rect x="110" y="200" width="292" height="24" rx="4" fill="#38bdf8"/>

    <!-- Pillars -->
    <rect x="120" y="240" width="48" height="150" rx="8" fill="url(#cyan-blue)"/>
    <rect x="200" y="240" width="48" height="150" rx="8" fill="url(#cyan-blue)"/>
    <rect x="280" y="240" width="48" height="150" rx="8" fill="url(#cyan-blue)"/>
    <rect x="360" y="240" width="48" height="150" rx="8" fill="url(#cyan-blue)"/>

    <!-- Base -->
    <rect x="90" y="390" width="332" height="30" rx="6" fill="#38bdf8"/>

    <!-- Currency / Checkmark Badge -->
    <circle cx="256" cy="160" r="22" fill="url(#gold-accent)"/>
    <text x="256" y="168" font-family="'Outfit', sans-serif" font-weight="900" font-size="24" fill="#0f172a" text-anchor="middle">Bs</text>
  </g>
</svg>
